[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.lumenadvisory.li/*"
  to = "https://lumenadvisory.li/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
