<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Dashboard</title>
  <link rel="stylesheet" href="client.css" />
</head>
<body>
  <div class="container">
    <div id="content" class="loading">Loading...</div>
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>

    <div id="dashboard" style="display: none;">
      <div class="header">
        <div>
          <h1>Client Dashboard</h1>
          <p class="welcome-text">Upload and manage your documents</p>
        </div>
        <button id="logout-btn" class="logout-btn">Sign Out</button>
      </div>

      <h2>Upload Document</h2>
      <form id="upload-form" class="upload-form">
        <div class="form-group">
          <label for="document-type">Document Type</label>
          <select id="document-type" required>
            <option value="">Select document type...</option>
            <option value="passport">Passport</option>
            <option value="id-card">ID Card</option>
            <option value="proof-of-address">Proof of Address</option>
            <option value="bank-statement">Bank Statement</option>
            <option value="tax-return">Tax Return</option>
            <option value="financial-statement">Financial Statement</option>
            <option value="contract">Contract</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="document-file">Choose File</label>
          <input type="file" id="document-file" accept=".pdf,.jpg,.jpeg,.png,.gif,.doc,.docx,.xls,.xlsx" required>
        </div>

        <button type="submit" class="upload-btn" id="upload-btn">Upload Document</button>
      </form>

      <div class="documents-section">
        <h2>Your Documents</h2>
        <div id="documents-container">
          <div class="loading">Loading documents...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/client.js"></script>
</body>
</html>
